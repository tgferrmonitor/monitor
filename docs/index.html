<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go For Key</title>
    <!-- Fonts para o MUI -->
    <link rel="stylesheet" href="https://googleapis.com" />
    <!-- MUI CSS (Emotion & Styled Engine) -->
    <script src="https://unpkg.com"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Cor de fundo cinza similar ao Chrome */
            background-color: #f1f3f4; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Roboto', sans-serif;
        }

        /* Estilização extra caso queira customizar o botão MUI */
        .btn-container {
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="btn-container" id="root">
        <!-- O botão MUI será renderizado aqui ou via HTML direto com classes MUI -->
        <button type="button" 
                style="
                    background-color: #1a73e8; 
                    color: white; 
                    padding: 10px 24px; 
                    border: none; 
                    border-radius: 4px; 
                    font-weight: 500; 
                    font-size: 0.875rem; 
                    text-transform: uppercase; 
                    cursor: pointer; 
                    box-shadow: 0px 3px 1px -2px rgba(0,0,0,0.2), 0px 2px 2px 0px rgba(0,0,0,0.14), 0px 1px 5px 0px rgba(0,0,0,0.12);
                    transition: background-color 250ms cubic-bezier(0.4, 0, 0.2, 1);
                "
                onmouseover="this.style.backgroundColor='#1765cc'"
                onmouseout="this.style.backgroundColor='#1a73e8'">
            GO FOR KEY!
        </button>
    </div>

    <!-- Script Linkvertise -->
    <script src="https://publisher.linkvertise.com/cdn/linkvertise.js"></script>
    <script>
        linkvertise(5382507, {whitelist: [], blacklist: [""]});
    </script>

</body>
</html>
